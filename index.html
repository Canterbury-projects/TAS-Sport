  background:var(--bg); color:var(--ink); font-size:var(--fs); display:flex; flex-direction:column; min-height:100vh}
body.kiosk{--fs:20px}
.wrap{flex:1 1 auto; display:flex; flex-direction:column; min-height:0}
header{background:linear-gradient(180deg,var(--navy),var(--navy2)); color:#fff; padding:.7rem 1rem .6rem}
.mast{display:flex; align-items:center; gap:.8rem; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:.6rem; margin-right:auto}
.brand img.crest{height:2.7rem; width:auto; display:block; flex:0 0 auto}
body.kiosk .brand img.crest{height:3.6rem}
.brand .b1{font-weight:800; letter-spacing:.13em; font-size:1.12rem; text-transform:uppercase; white-space:nowrap}
.brand .b2{font-weight:600; color:var(--gold); letter-spacing:.06em; font-size:.76rem; text-transform:uppercase}
.live{display:inline-flex; align-items:center; gap:.35rem; background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:.2rem .6rem; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,18,48,.55)}70%{box-shadow:0 0 0 9px rgba(196,18,48,0)}100%{box-shadow:0 0 0 0 rgba(196,18,48,0)}}
.tools{display:flex; align-items:center; gap:.45rem; flex-wrap:wrap}
.tools label{font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; opacity:.75}
select,input[type=search],button{font:inherit; font-size:.85rem}
select,input[type=search]{background:#fff; color:var(--ink); border:1px solid rgba(255,255,255,.35); border-radius:8px; padding:.38rem .5rem}
input[type=search]{min-width:14rem}
button.tbtn{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28); border-radius:8px; padding:.4rem .65rem; cursor:pointer}
button.tbtn:hover{background:rgba(255,255,255,.22)}
.subbar{display:flex; gap:.9rem; align-items:center; flex-wrap:wrap; padding:.35rem 1rem; background:#002744; color:#c5d3de; font-size:.73rem}
.subbar .sep{opacity:.35}
.subbar a{color:#9fc6e6}
main{flex:1 1 auto; display:grid; grid-template-columns:minmax(0,1fr) 24rem; gap:1rem; padding:1rem; align-items:start}
@media (max-width:920px){ main{grid-template-columns:minmax(0,1fr)} }
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 2px rgba(16,32,56,.05)}
/* Main panel heading. The sport is the thing you should read from across the room,
   so it carries the size and the colour; round and page sit beside it as detail. */
.mainhead{display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; margin:0 0 .75rem}
.sporttag{margin:0; font-size:1.7rem; line-height:1; font-weight:800; letter-spacing:.05em;
  text-transform:uppercase; color:var(--gold); text-shadow:0 2px 8px rgba(0,0,0,.5)}
body.kiosk .sporttag{font-size:2.2rem}
.roundtag{font-size:.78rem; letter-spacing:.11em; text-transform:uppercase; color:var(--mut)}
.pagetag{font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:#cfe0f0;
  background:rgba(255,255,255,.1); border:1px solid var(--line); padding:.14rem .5rem; border-radius:999px}
.mainhead .rule{flex:1 1 4rem; height:2px; min-width:2rem;
  background:linear-gradient(90deg,var(--accent),rgba(196,18,48,0))}
.sec-title{display:flex; align-items:center; gap:.5rem; margin:0 0 .6rem}
.sec-title h2{margin:0; font-size:.76rem; letter-spacing:.13em; text-transform:uppercase; color:var(--mut)}
.sec-title .rule{flex:1; height:1px; background:var(--line)}
.lead{padding:1.1rem 1.25rem 1.15rem; position:relative; overflow:hidden}
.lead:before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--accent)}
.kicker{display:inline-flex; align-items:center; gap:.45rem; font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); flex-wrap:wrap}
.kicker .rnd{background:#f9e7ea; border-radius:4px; padding:.1rem .35rem; color:#a30f28}
.kicker .sport{background:var(--grey1); border-radius:4px; padding:.1rem .35rem; color:var(--navy)}
.lead h1{margin:.5rem 0 .45rem; font-size:1.9rem; line-height:1.15; letter-spacing:-.015em}
body.kiosk .lead h1{font-size:2.45rem}
.lead p.dek{margin:0; color:var(--mut); font-size:.94rem; line-height:1.45}
.scoreline{display:flex; align-items:center; gap:.7rem; margin-top:.9rem; flex-wrap:wrap}
.sl-team{display:flex; align-items:center; gap:.5rem; font-weight:600}
.sl-score{font-variant-numeric:tabular-nums; font-weight:800; font-size:1.3rem}
/* School badges: one sprite sheet of the eight TAS school logos, 8 x 48px cells,
   taken from the same public asset bucket the fixtures site itself uses. */
.badge{width:2rem;height:2rem;border-radius:6px;flex:0 0 auto;background-color:#fff;
  border:1px solid var(--line); background-image:var(--sprite);
  background-size:800% 100%; background-repeat:no-repeat}
.badge.s{width:1.5rem;height:1.5rem;border-radius:4px}
.badge.txt{display:grid;place-items:center;color:#fff;font-size:.6rem;font-weight:800;
  background-image:none;border:0}
.badge.s.txt{font-size:.48rem}
.lead .dots{position:absolute; right:1rem; bottom:.8rem; display:flex; gap:.3rem}
.lead .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.lead .dots i.on{background:var(--accent)}
.hgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(21rem,1fr)); gap:.85rem; margin-top:.9rem}
.story{padding:.85rem 1rem .8rem; display:flex; flex-direction:column; gap:.6rem; cursor:pointer}
/* scoreboard rows: school name leads, team grade sits under it, score on the right */
.sb{display:flex; flex-direction:column; gap:.4rem}
.sb-row{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.6rem}
.sb-row .nm{font-size:1.05rem; font-weight:700; line-height:1.15}
.sb-row .nm small{display:block; font-size:.73rem; font-weight:500; color:var(--mut); letter-spacing:.01em}
.sb-row .sc{font-variant-numeric:tabular-nums; font-weight:800; font-size:1.35rem}
.sb-row.lose .nm,.sb-row.lose .sc{opacity:.55}
.story .foot{display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; font-size:.72rem;
  color:var(--mut); padding-top:.5rem; border-top:1px solid rgba(255,255,255,.09)}
.story .sportname{font-weight:800; letter-spacing:.11em}
.story:hover{border-color:#c3cfdd}
.story .kicker{font-size:.6rem; color:var(--mut)}
.story h3{margin:0; font-size:1rem; line-height:1.25}
.story .meta{font-size:.73rem; color:var(--mut); display:flex; gap:.4rem; flex-wrap:wrap; align-items:center}
.tag{background:var(--grey1); border-radius:4px; padding:.05rem .35rem; font-size:.67rem; color:#42484e}
.tag.w{background:#e3ecf3; color:var(--win)} .tag.l{background:#f9e7ea; color:var(--loss)}
.rail{display:flex; flex-direction:column; gap:1rem; position:sticky; top:.75rem}
@media (max-width:920px){ .rail{position:static} }
.snap{padding:.9rem 1rem}
.snap h2{margin:0 0 .55rem; font-size:.76rem; letter-spacing:.12em; text-transform:uppercase; color:var(--mut)}
.snap .big{display:flex; align-items:center; gap:.6rem; margin-bottom:.45rem}
.snap .rec{font-size:1.45rem; font-weight:800; font-variant-numeric:tabular-nums}
.recl{font-size:.7rem; color:var(--mut); text-transform:uppercase; letter-spacing:.08em}
.snap ul{list-style:none; margin:.35rem 0 0; padding:0; font-size:.79rem}
.snap li{display:flex; justify-content:space-between; gap:.5rem; padding:.18rem 0; border-top:1px dashed var(--line)}
/* win / draw / loss bars */
.bar{display:flex; height:.6rem; border-radius:4px; overflow:hidden; background:rgba(255,255,255,.1)}
.bar i{display:block; height:100%}
.bar i.w{background:#2f9e63} .bar i.d{background:var(--gold)} .bar i.l{background:#9a2434}
.legend{display:flex; gap:.7rem; align-items:center; font-size:.67rem; color:var(--mut); margin-top:.4rem}
.legend i{width:.55rem; height:.55rem; border-radius:2px; display:inline-block; margin-right:.3rem}
.legend i.w{background:#2f9e63} .legend i.d{background:var(--gold)} .legend i.l{background:#9a2434}
.snaphd{display:flex; align-items:baseline; gap:.5rem; margin-top:1rem; padding-top:.7rem;
  border-top:1px solid rgba(255,255,255,.13); font-size:.68rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--mut)}
.snaphd b{margin-left:auto; font-variant-numeric:tabular-nums; letter-spacing:0; font-size:.82rem; color:#dce7f1}
.sportone{margin-top:.5rem}
.sportone .srow{display:flex; align-items:baseline; gap:.6rem; margin-bottom:.4rem}
.sportone .sname{font-size:1rem; font-weight:700}
.sportone .scount{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:800; font-size:1.05rem}
.rot{overflow:hidden}
.rot .rhead{display:flex; align-items:baseline; gap:.5rem; padding:.7rem .9rem .55rem; border-bottom:1px solid var(--line)}
.rot .rhead h2{margin:0; font-size:.88rem; flex:1 1 auto; line-height:1.2}
.rot .rhead .cnt{font-size:.66rem; color:var(--mut)}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.prog.run i{animation:fill linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
table.lad{width:100%; border-collapse:collapse; font-size:.78rem}
table.lad th{text-align:right; font-size:.62rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); padding:.4rem .3rem; border-bottom:1px solid var(--line); font-weight:700}
table.lad th:nth-child(1),table.lad th:nth-child(2){text-align:left}
table.lad td{padding:.32rem .3rem; border-bottom:1px solid #eef1f5; text-align:right; font-variant-numeric:tabular-nums}
table.lad td:nth-child(1){text-align:left; color:var(--mut); width:1.5rem}
table.lad td:nth-child(2){text-align:left}
table.lad tr.me{background:#eaf1f7}
table.lad tr.top td{font-weight:700}
.tm{display:flex; align-items:center; gap:.4rem}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0; transform:translateY(5px)}to{opacity:1; transform:none}}
.rot .ctl{display:flex; gap:.35rem; padding:.5rem .9rem .7rem}
.rot .ctl button{background:#eef2f7;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:.2rem .5rem;font-size:.73rem;color:#41546a}
.rot .ctl button:hover{background:#e3e9f1}
.sv-head{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; padding:.85rem 1rem; border-bottom:1px solid var(--line)}
.sv-head h2{margin:0; font-size:1.02rem}
.sv-head .n{color:var(--mut); font-size:.8rem}
.chips{display:flex; gap:.3rem; flex-wrap:wrap; padding:.55rem 1rem; border-bottom:1px solid var(--line); background:#fbfcfe; align-items:center}
.chip{background:#eef2f7; border:1px solid var(--line); border-radius:999px; padding:.16rem .6rem; font-size:.73rem; cursor:pointer; color:#41546a}
.chip.on{background:var(--navy); color:#fff; border-color:var(--navy)}
table.res{width:100%; border-collapse:collapse; font-size:.82rem}
table.res th{position:sticky; top:0; background:#fff; text-align:left; font-size:.62rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); padding:.5rem .55rem; border-bottom:1px solid var(--line)}
table.res td{padding:.45rem .55rem; border-bottom:1px solid #eef1f5; vertical-align:top}
table.res td.sc{font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap}
table.res tr:hover{background:#fafbfd}
.tblwrap{overflow:auto}
.empty{padding:2rem 1rem; text-align:center; color:var(--mut)}
.pill{display:inline-block; font-size:.67rem; padding:.05rem .35rem; border-radius:4px; background:#eef2f7; color:#41546a}
.pill.bye{background:#f1ecfa;color:#5b3fa0} .pill.can{background:#f7ecec;color:#9b3131}
.ticker{position:sticky; bottom:0; background:var(--navy); color:#fff; border-top:3px solid var(--accent); display:flex; overflow:hidden; z-index:5}
.ticker .lbl{background:var(--accent); font-size:.68rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; display:grid; place-items:center; padding:0 .8rem; flex:0 0 auto}
.tk-mask{overflow:hidden; flex:1 1 auto}
.tk-run{display:inline-flex; white-space:nowrap; animation:tkscroll linear infinite; padding:.5rem 0}
.ticker:hover .tk-run{animation-play-state:paused}
@keyframes tkscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-item{display:inline-flex; align-items:center; gap:.45rem; padding:0 1.05rem; font-size:.82rem; border-right:1px solid rgba(255,255,255,.14)}
.tk-item .g{color:var(--gold); font-size:.66rem; letter-spacing:.05em; text-transform:uppercase}
.tk-item .s{font-weight:800; font-variant-numeric:tabular-nums}
.tk-item .wn{color:var(--grey1); font-weight:600}
footer{padding:.55rem 1rem .9rem; font-size:.69rem; color:var(--mut); text-align:center}
.hidden{display:none !important}
#boot{padding:3rem 1rem; text-align:center; color:var(--mut)}
body.stale #asOf:after{content:" (built-in snapshot)"; color:var(--gold)}
/* presentation mode: entered with F, strips the chrome and enlarges everything */
body.present{--fs:24px}
body.present .subbar, body.present footer, body.present .tools{display:none}
body.present main{padding:1.25rem}
body.present header{padding:.9rem 1.25rem .8rem}
.exithint{display:none}
body.present .exithint{display:inline-flex; align-items:center; gap:.3rem; margin-left:auto;
  font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.5)}

/* ============ dark broadcast treatment ============
   Overrides the light surfaces defined above. Kept as one block so the
   light theme underneath stays intact and can be restored by deleting this. */
header{background:linear-gradient(180deg,#012647,#01406f); border-bottom:2px solid var(--gold)}

/* ---- gold: used only for honours and section marks, never for body text ---- */
.brand .b2{color:var(--gold)}
.sec-title .rule{background:linear-gradient(90deg,var(--gold) 0 2.25rem,var(--line) 2.25rem)}
.prog i{background:var(--gold)}
table.lad tr.top{box-shadow:inset 3px 0 0 var(--gold)}
table.lad tr.top td:first-child{color:var(--gold); font-weight:800}
table.lad tr.top td:nth-child(2){color:#fff}
.story .sportname{color:var(--gold)}
.sb-row .nm{color:#fff}
.sb-row .sc{color:#dce7f1}
.sb-row.win .sc{color:var(--gold)}
.snap li b{color:var(--gold)}
.snap .rec{color:var(--gold)}
input[type=search]:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold)}
.tk-item .g{color:var(--gold)}
.subbar{background:#01223c; color:#a9c0d6}
.subbar a{color:#79b6ef}
.card{background:var(--card); border-color:var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.09) inset, 0 6px 18px rgba(0,0,0,.55)}
.lead h1{color:#fff}
.lead p.dek{color:#a9bed2}
.kicker .rnd{background:rgba(196,18,48,.22); color:#ff9aab}
.kicker .sport{background:rgba(255,255,255,.09); color:#cfe0f0}
.tag{background:rgba(255,255,255,.09); color:#c6d5e3}
.tag.w{background:rgba(47,110,168,.3); color:#9fd0ff}
.tag.l{background:rgba(196,18,48,.26); color:#ff9aab}
.lead .dots i{background:rgba(255,255,255,.2)}
.lead .dots i.on{background:var(--accent)}
.story:hover{border-color:#2a5c8c}
.snap li{border-top-color:rgba(255,255,255,.12)}
/* logos keep a light tile so the school marks stay legible on navy */
.badge{background-color:#f4f6f8; border-color:rgba(0,0,0,.25)}
table.lad td{border-bottom-color:rgba(255,255,255,.08)}
table.lad tbody tr:nth-child(even){background:rgba(255,255,255,.035)}
/* the selected school's row. Needs tbody in the selector so it outranks the
   nth-child banding above, which would otherwise win on every second row. */
table.lad tbody tr.me{background:linear-gradient(90deg,rgba(196,18,48,.55),rgba(196,18,48,.3));
  box-shadow:inset 6px 0 0 var(--accent), 0 0 0 1px rgba(255,154,171,.45)}
table.lad tbody tr.me td{color:#fff; font-weight:800; font-size:.84rem; padding-top:.45rem; padding-bottom:.45rem}
table.lad tbody tr.me:not(.top) td:first-child{color:#ffd0d8}
table.lad tbody tr.me .badge{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
table.res th{background:var(--card); color:#9db4c9}
table.res td{border-bottom-color:rgba(255,255,255,.08)}
table.res tr:hover{background:rgba(255,255,255,.05)}
.chips{background:rgba(255,255,255,.03)}
.chip{background:rgba(255,255,255,.09); border-color:var(--line); color:#c6d5e3}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
.rot .ctl button{background:rgba(255,255,255,.09); border-color:var(--line); color:#c6d5e3}
.rot .ctl button:hover{background:rgba(255,255,255,.18)}
.pill{background:rgba(255,255,255,.09); color:#c6d5e3}
.pill.bye{background:rgba(255,255,255,.07); color:#9db4c9}
.pill.can{background:rgba(196,18,48,.26); color:#ff9aab}
.prog{background:rgba(255,255,255,.12)}
.ticker{background:#001a2f}
select,input[type=search]{background:#0e3255; color:var(--ink); border-color:var(--line)}
input[type=search]::placeholder{color:#7f97ad}
button.tbtn{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.28)}
</style>
</head>

async function loadEmbedded(){
  var el = $("tasdata");
  if(!el) throw new Error("no embedded snapshot in this file");
  var b64 = el.textContent.trim();
  if(typeof DecompressionStream !== "function") throw new Error("DecompressionStream is not available");
  var ds = new DecompressionStream("gzip");
  var w = ds.writable.getWriter(); w.write(b64ToBytes(b64)); w.close();
  return JSON.parse(await new Response(ds.readable).text());
}
(async function boot(){
  var D, live=false;
  try{ D = await loadLive(); live=true; console.log("Loaded live data.json"); }
  catch(e){
    console.warn("Live data.json unavailable (" + (e && e.message) + "), using the embedded snapshot");
    try{ D = await loadEmbedded() }
    catch(e2){ return fail("No data available. " + (e2 && e2.message)) }
  }
  try{ run(D); if(!live) document.body.classList.add("stale") }
  catch(e){ fail(e && e.message || String(e)); console.error(e && e.stack) }
})();

function hashStr(str){ var h=2166136261;
  for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619) }
  return h>>>0 }
function headlineFor(m){
  var k=hashStr(m.date+"|"+m.ci+"|"+m.gi+"|"+m.h+"|"+m.a);
  if(m.drawn) return DRAW_T[k%DRAW_T.length](teamFull(m.h),teamFull(m.a), m.hasScore?(m.hs+"–"+m.as):"");
  var W=teamFull(m.wIdx), L=teamFull(m.lIdx);
  if(!m.hasScore) return NOSCORE_T[k%NOSCORE_T.length](W,L);
  return WIN_T[k%WIN_T.length](W,L,m.wScore+"–"+m.lScore);
}
function dekFor(m){
  var bits=[], lw=m.wIdx>=0?LADROW[m.wIdx]:null, ll=m.lIdx>=0?LADROW[m.lIdx]:null;
  if(ll&&lw&&ll.rank<lw.rank) bits.push("An upset: "+esc(teamFull(m.lIdx))+" came in "+ord(ll.rank)+", ahead of their opponents");
  if(lw&&lw.Pts!=null) bits.push(esc(teamFull(m.wIdx))+" sit "+ord(lw.rank)+" in "+esc(lw.grade)+" on "+lw.Pts+" points"+(lw.W!=null?" ("+lw.W+"–"+lw.L+")":""));

/* The association's own sortOrder is not a seniority ranking (it puts "Boys 1st V"
   at 65 and "Boys Year 10" at 28), so work seniority out from the grade name.
   Lower tier means a more senior team, and the lead headline goes to the lowest tier. */
var TIER={};
function gradeTier(name){
  if(name in TIER) return TIER[name];
  var t=8;
  if(!name) t=9;
  else if(/\b1st\b/i.test(name)) t=0;
  else if(/\b2nd\b/i.test(name)) t=1;
  else if(/\b3rd\b|\b4th\b|\b5th\b|\b6th\b/i.test(name)) t=2;
  else if(/senior/i.test(name)) t=3;
  else if(/intermediate/i.test(name)) t=5;
  else if(/junior/i.test(name)) t=7;
  else {
    var y=name.match(/year\s*(\d+)/i);
    if(y){ var n=+y[1]; t = n>=10?4 : n===9?5 : n===8?6 : 7 }
  }
  TIER[name]=t; return t;
}
function storyScore(m){
  var sc=(10-gradeTier(m.grade))*30;          // seniority dominates: firsts lead
  if(m.hOrg===ST.home||m.aOrg===ST.home) sc+=60;   // then our own school
  if(m.wIdx>=0&&teamOrg(m.wIdx)===ST.home) sc+=10;
  var lw=m.wIdx>=0?LADROW[m.wIdx]:null, ll=m.lIdx>=0?LADROW[m.lIdx]:null;
  if(lw&&ll&&ll.rank<lw.rank) sc+=20;         // an upset is worth promoting
  if(m.diff===1) sc+=5;
  if(!m.hasScore) sc-=30;
  sc -= m.gsort/1000;                          // stable tiebreak
  return sc;
}
/* The main panel works through one sport at a time, in alphabetical order.
   Each sport gets up to two pages of 7 stories (1 lead + 6 cards), so the lead
   headline always belongs to the same sport as the cards beneath it. */
var PAGES=[], LAST=null, LASTROUND=null, PER_PAGE=7, MAX_PAGES=2;
function buildPages(){
  var pl=scope().filter(function(m){return m.played});
  var dates=pl.map(function(m){return m.date}).sort();
  LAST=dates.length?dates[dates.length-1]:null;
  var day=pl.filter(function(m){return m.date===LAST});
  LASTROUND=day.length?day[0].round:null;
  var groups={}, order=[];
  day.forEach(function(m){ if(!groups[m.ci]){groups[m.ci]=[];order.push(m.ci)} groups[m.ci].push(m) });
  order.sort(function(a,b){ return compShort(a).localeCompare(compShort(b)) });
  PAGES=[];
  order.forEach(function(ci){
    var list=groups[ci].slice().sort(function(a,b){return storyScore(b)-storyScore(a)})
              .slice(0,PER_PAGE*MAX_PAGES);
    var total=Math.max(1,Math.ceil(list.length/PER_PAGE));
    for(var p=0;p<total;p++)
      PAGES.push({ci:ci,page:p,total:total,items:list.slice(p*PER_PAGE,(p+1)*PER_PAGE)});
  });
  if(!PAGES.length) PAGES=[{ci:-1,page:0,total:1,items:[]}];
}
function curPage(){ var n=PAGES.length; return PAGES[((ST.pageIdx%n)+n)%n] }

  $("pageTag").style.display = pg.total>1 ? "" : "none";
}

/* Win / draw / loss record for the home school across a list of played matches */
function recordFor(list){
  var r={w:0,d:0,l:0,n:0}, id=ST.home;
  list.forEach(function(m){
    if(!m.played) return;
    var side=m.hOrg===id?"h":(m.aOrg===id?"a":null); if(!side) return;
    r.n++;
    if(m.drawn){ r.d++; return }
    var won=m.wIdx>=0&&((side==="h"&&m.wIdx===m.h)||(side==="a"&&m.wIdx===m.a));
    won?r.w++:r.l++;
  });
  return r;
}
function barFor(r){
  if(!r.n) return '<div class="bar"></div>';
  var p=function(v){ return (v/r.n*100).toFixed(2)+"%" };
  return '<div class="bar" title="'+r.w+' won, '+r.d+' drawn, '+r.l+' lost">'+
    (r.w?'<i class="w" style="width:'+p(r.w)+'"></i>':'')+
    (r.d?'<i class="d" style="width:'+p(r.d)+'"></i>':'')+
    (r.l?'<i class="l" style="width:'+p(r.l)+'"></i>':'')+'</div>';
}

  var roundTotal=recordFor(dayList.filter(function(m){return m.hOrg===id||m.aOrg===id}));

  var want=curPage().ci;

  var single="";
  if(want!=null && bySport[want]){
    var r=recordFor(bySport[want]);
    single='<div class="sportone fade">'+

  } else if(want!=null){

  } else if(order.length){
    single=order.map(function(ci){ var r=recordFor(bySport[ci]);

    '<div class="big">'+badge(id)+'<span class="rec">'+wdlText(term)+'</span>'+
      '<span class="recl">W&ndash;D&ndash;L '+esc(ST.sport==="all"?"this term":compShort(ST.sport))+'</span></div>'+
    barFor(term)+
    '<div class="legend"><span><i class="w"></i>'+term.w+'</span>'+
      '<span><i class="d"></i>'+term.d+'</span>'+
      '<span><i class="l"></i>'+term.l+'</span>'+
      '<span style="margin-left:auto">'+pct+'% wins</span></div>'+
    (LAST?'<div class="snaphd">Round '+LASTROUND+' &middot; '+esc(shortDate(LAST))+

/* ---------- rotating ladders ---------- */
var LADS=[], LADS_CI=null;
/* The ladder rail follows whichever sport the main panel is showing, so the whole
   screen is about one sport at a time. Ladders that include the selected school
   come first, so the row you care about appears early in the cycle. */
function buildLads(){
  var want = curPage().ci;
  if(want == null || want < 0) want = (ST.sport === "all" ? null : ST.sport);
  LADS_CI = want;
  LADS=D.L.map(function(L,li){return {li:li,ci:L[0],grade:L[1],gsort:L[2],pool:L[3],hs:L[4],rows:L[5]}})
    .filter(function(x){ return want==null ? true : x.ci===want })
    .filter(function(x){ return x.rows.length>0 });
  var mine=function(x){ return x.rows.some(function(r){return teamOrg(r[1])===ST.home})?0:1 };
  LADS.sort(function(a,b){ return mine(a)-mine(b) || a.ci-b.ci || a.gsort-b.gsort });
}
/* Called when the main panel turns over. Rebuilds the rail only when the sport
   actually changed, so the ladder keeps cycling smoothly within a sport. */
function syncRailToPage(){
  var want = curPage().ci;
  if(want == null || want < 0) want = (ST.sport === "all" ? null : ST.sport);
  if(want === LADS_CI) return;
  buildLads(); ST.rot = 0; renderRot();
}
function renderRot(){
  if(!LADS.length){ $("rotTitle").textContent="Ladders"; $("rotBody").innerHTML='<div class="empty">No ladders for this selection.</div>'; return }
  var n=LADS.length, k=((ST.rot%n)+n)%n, g=LADS[k];
  $("rotTitle").innerHTML=esc(g.grade)+' <span class="recl">'+esc(compShort(g.ci))+(g.pool&&g.pool!=="Pool 1"?" · "+esc(g.pool):"")+'</span>';
  $("rotCnt").textContent=(k+1)+"/"+n;
  var cols=g.hs.filter(function(h){return ["P","W","L","D","Points","Pts","Sets %","%"].indexOf(h)>=0});
  if(!cols.length) cols=g.hs.slice(0,4);
  var head='<table class="lad"><thead><tr><th>#</th><th>Team</th>'+cols.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>';
  var body=g.rows.map(function(r){
    var ti=r[1], mine=teamOrg(ti)===ST.home, vals={};
    g.hs.forEach(function(h,i){ vals[h]=r[2+i] });
    return '<tr class="'+(mine?'me ':'')+(r[0]===1?'top':'')+'"><td>'+r[0]+'</td>'+
      '<td><span class="tm">'+badge(teamOrg(ti),'s')+esc(teamFull(ti))+'</span></td>'+
      cols.map(function(h){var v=vals[h]; return '<td>'+(v==null?'–':esc(v))+'</td>'}).join('')+'</tr>';
  }).join('');
  var b=$("rotBody"); b.innerHTML=head+body+'</tbody></table>';
  b.classList.remove("fade"); void b.offsetWidth; b.classList.add("fade");
  restartProg();
}
var ROT_MS=10000, LEAD_MS=20000, rotTimer=null, leadTimer=null;
function restartProg(){ var p=$("prog"); p.classList.remove("run"); void p.offsetWidth;
  p.firstElementChild.style.animationDuration=ROT_MS+"ms"; if(!ST.rotPaused) p.classList.add("run") }
function startTimers(){ stopTimers(); if(ST.rotPaused) return;
  rotTimer=setInterval(function(){ST.rot++;renderRot()},ROT_MS);
  leadTimer=setInterval(function(){
    ST.pageIdx++; renderLead(); renderGrid(); syncRailToPage(); renderSnap();
  },LEAD_MS) }
function stopTimers(){ if(rotTimer)clearInterval(rotTimer); if(leadTimer)clearInterval(leadTimer);
  rotTimer=leadTimer=null }

/* ---------- ticker ---------- */
function renderTicker(){
  var pl=scope().filter(function(m){return m.played});
  var dates=pl.map(function(m){return m.date}).sort();
  var last=dates[dates.length-1];
  var src=pl.filter(function(m){return m.date===last});
  if(src.length<8){ var prev=dates.filter(function(d){return d!==last}).pop();
    src=src.concat(pl.filter(function(m){return m.date===prev})) }
  src=src.slice().sort(function(a,b){return a.ci-b.ci||a.gsort-b.gsort});
  var items=src.map(function(m){
    return '<span class="tk-item"><span class="g">'+esc(compShort(m.ci)+" · "+m.grade)+'</span>'+
      '<span>'+esc(m.hName)+'</span>'+(m.hasScore?'<span class="s">'+m.hs+'–'+m.as+'</span>':'<span class="s">v</span>')+
      '<span>'+esc(m.aName)+'</span>'+
      '<span class="wn">'+esc(m.drawn?'drawn':(m.wIdx>=0?orgAcr(teamOrg(m.wIdx))+' win':''))+'</span></span>';
  }).join('');
  var run=$("tkRun"); run.innerHTML=items+items;
  run.style.animationDuration=Math.max(140,Math.round(src.length*15))+"s";
  $("ticker").classList.toggle("hidden", !src.length);
}

/* ---------- search ---------- */
function matches(){
  var toks=ST.q.toLowerCase().split(/\s+/).filter(Boolean);
  return scope().filter(function(m){
    if(ST.round&&m.round!==ST.round) return false;
    if(ST.grade!=null&&m.gi!==ST.grade) return false;
    for(var i=0;i<toks.length;i++) if(m.blob.indexOf(toks[i])<0) return false;
    return true;
  }).sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(a.ci-b.ci||a.gsort-b.gsort) });
}
function renderChips(){
  var rounds=[]; scope().forEach(function(m){ if(rounds.indexOf(m.round)<0) rounds.push(m.round) });
  rounds.sort(function(a,b){return a-b});
  $("roundChips").innerHTML='<span class="recl" style="margin-right:.2rem">Round</span>'+
    '<span class="chip'+(ST.round?'':' on')+'" data-r="">All</span>'+
    rounds.map(function(r){return '<span class="chip'+(ST.round===r?' on':'')+'" data-r="'+r+'">'+r+'</span>'}).join('');
  var used={}; scope().forEach(function(m){ if(m.gi>=0) used[m.gi]=1 });
  var gs=Object.keys(used).map(function(i){return {i:+i,n:D.G[i][0],s:D.G[i][1]}}).sort(function(a,b){return a.s-b.s});
  $("gradeChips").innerHTML='<span class="recl" style="margin-right:.2rem">Grade</span>'+
    '<span class="chip'+(ST.grade==null?' on':'')+'" data-g="">All</span>'+
    gs.map(function(g){return '<span class="chip'+(ST.grade===g.i?' on':'')+'" data-g="'+g.i+'">'+esc(g.n)+'</span>'}).join('');
  Array.prototype.forEach.call($("roundChips").querySelectorAll(".chip"),function(c){
    c.addEventListener("click",function(){var v=c.getAttribute("data-r"); ST.round=v?+v:null; renderSearch()})});
  Array.prototype.forEach.call($("gradeChips").querySelectorAll(".chip"),function(c){
    c.addEventListener("click",function(){var v=c.getAttribute("data-g"); ST.grade=v===""?null:+v; renderSearch()})});
}
function renderSearch(){
  renderChips();
  var res=matches(), pl=res.filter(function(m){return m.played});
  $("svTitle").textContent=ST.q?'"'+ST.q+'"':"All fixtures";
  $("svCount").textContent=res.length+" fixture"+(res.length===1?"":"s")+" · "+pl.length+" with results";
  if(!res.length){ $("svBody").innerHTML='<div class="empty">Nothing matched. Try a school, team, grade, round number or venue.</div>'; return }
  var summary="";
  var q=ST.q.toLowerCase();
  var hit=Object.keys(D.o).filter(function(id){ return q&&(orgName(id).toLowerCase().indexOf(q)>=0||orgAcr(id).toLowerCase()===q) });
  if(hit.length===1){
    var id=+hit[0],w=0,l=0,d=0;
    pl.forEach(function(m){ var side=m.hOrg===id?"h":(m.aOrg===id?"a":null); if(!side)return;
      if(m.drawn){d++;return}
      var won=m.wIdx>=0&&((side==="h"&&m.wIdx===m.h)||(side==="a"&&m.wIdx===m.a)); won?w++:l++ });
    summary='<div class="chips"><span class="pill">'+esc(orgName(id))+' in this selection: <b>'+w+'W – '+l+'L'+(d?' – '+d+'D':'')+'</b></span></div>';
  }
  var rows=res.slice(0,400).map(function(m){
    var sc = m.bye?'<span class="pill bye">Bye</span>' : m.cancelled?'<span class="pill can">Cancelled</span>'
      : m.hasScore?(m.hs+'–'+m.as) : m.played?'<span class="pill">Result only</span>' : '<span class="pill">No result</span>';
    var res2 = m.played?(m.drawn?'Drawn':(m.wIdx>=0?orgAcr(teamOrg(m.wIdx))+' win':'')):'';
    return '<tr><td>'+esc(shortDate(m.date))+(m.noTime?'':'<br><span class="recl">'+ampm(m.time)+'</span>')+'</td>'+
      '<td>'+m.round+'</td><td>'+esc(compShort(m.ci))+'<br><span class="recl">'+esc(m.grade)+'</span></td>'+
      '<td><span class="tm">'+badge(m.hOrg,'s')+esc(m.hName)+'</span>'+
      (m.bye?'':'<span class="tm" style="margin-top:.2rem">'+badge(m.aOrg,'s')+esc(m.aName)+'</span>')+'</td>'+
      '<td class="sc">'+sc+(res2?'<br><span class="recl">'+esc(res2)+'</span>':'')+'</td>'+
      '<td>'+esc(m.venue||'–')+'</td></tr>';
  }).join('');
  $("svBody").innerHTML=summary+'<div class="tblwrap"><table class="res"><thead><tr>'+
    '<th>Date</th><th>Rd</th><th>Sport / Grade</th><th>Match</th><th>Score</th><th>Venue</th></tr></thead><tbody>'+
    rows+'</tbody></table></div>'+(res.length>400?'<div class="empty">Showing the first 400 of '+res.length+'. Narrow the search to see more.</div>':'');
}
function setMode(on){
  $("newsCol").classList.toggle("hidden",on); $("searchCol").classList.toggle("hidden",!on);
  $("liveLbl").textContent=on?"Searching":"Results";
  if(on) stopTimers(); else startTimers();
}
function onSearch(){
  ST.q=$("q").value.trim();
  var on=!!ST.q||ST.round!=null||ST.grade!=null;
  setMode(on); if(on) renderSearch();
}

/* ---------- chrome ---------- */
function renderChrome(){
  $("termLbl").textContent=D.term+" · The Associated Schools";
  var t=new Date(D.asOf);
  $("asOf").innerHTML="Data as at <b>"+t.toLocaleString([], {day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"})+"</b>";
  var s=scope(), pl=s.filter(function(m){return m.played});
  $("counts").textContent=s.length+" fixtures · "+pl.length+" results · "+LADS.length+" ladders"+
    (LAST?" · latest: Round "+LASTROUND+", "+niceDate(LAST):"");
  $("foot").textContent="Canterbury Taipans. TAS results, built from the public TAS fixtures feed. Snapshot taken "+t.toLocaleString()+".";
  $("sportSel").innerHTML='<option value="all"'+(ST.sport==="all"?" selected":"")+'>All sports</option>'+
    D.C.map(function(c,i){return '<option value="'+i+'"'+(ST.sport===i?" selected":"")+'>'+esc(compShort(i))+'</option>'}).join('');
  $("homeSel").innerHTML=Object.keys(D.o).map(function(id){
    return '<option value="'+id+'"'+(+id===ST.home?" selected":"")+'>'+esc(orgName(id))+'</option>'}).join('');
}
function fullRender(){ buildPages(); buildLads(); ST.rot=0; renderChrome(); renderLead(); renderGrid(); renderSnap(); renderRot(); renderTicker() }

$("boot").classList.add("hidden"); $("app").classList.remove("hidden");
document.body.classList.toggle("kiosk",ST.kiosk);
fullRender(); startTimers();

$("sportSel").addEventListener("change",function(e){
  ST.sport = e.target.value==="all"?"all":+e.target.value;
  localStorage.setItem("tas.sport",String(ST.sport));
  ST.pageIdx=0; ST.round=null; ST.grade=null; fullRender();
  if(!$("searchCol").classList.contains("hidden")) renderSearch();
});
$("homeSel").addEventListener("change",function(e){
  ST.home=+e.target.value; localStorage.setItem("tas.home",ST.home); ST.pageIdx=0; fullRender();
  if(!$("searchCol").classList.contains("hidden")) renderSearch();
});
$("q").addEventListener("input",onSearch);
$("clearBtn").addEventListener("click",function(){ $("q").value=""; ST.round=null; ST.grade=null; onSearch(); $("q").focus() });
$("kioskBtn").addEventListener("click",function(){ ST.kiosk=!ST.kiosk;
  localStorage.setItem("tas.kiosk",ST.kiosk?"1":"0");
  document.body.classList.toggle("kiosk", ST.kiosk||ST.present) });

/* ---------- full screen (F) ----------
   Falls back to a chrome-free presentation layout if the browser or the host
   frame refuses the Fullscreen API, so F always does something useful. */
function setPresent(on){
  ST.present=on;
  document.body.classList.toggle("present",on);
  document.body.classList.toggle("kiosk", on||ST.kiosk);
  $("fullBtn").textContent = on ? "⛶ Exit full screen" : "⛶ Full screen";
}
function isFull(){ return !!(document.fullscreenElement||document.webkitFullscreenElement) }
function toggleFull(){
  var el=document.documentElement;
  if(!isFull()){
    var req=el.requestFullscreen||el.webkitRequestFullscreen;
    setPresent(true);
    if(req){ try{ var p=req.call(el); if(p&&p.catch) p.catch(function(e){
      console.warn("Fullscreen refused, staying in presentation mode:", e&&e.message) }) }
      catch(e){ console.warn("Fullscreen threw, staying in presentation mode:", e&&e.message) } }
    else console.warn("Fullscreen API unavailable, using presentation mode");
  } else {
    var ex=document.exitFullscreen||document.webkitExitFullscreen;
    if(ex) try{ ex.call(document) }catch(e){}
    setPresent(false);
  }
}
$("fullBtn").addEventListener("click",toggleFull);
document.addEventListener("fullscreenchange",function(){ if(!isFull()&&ST.present) setPresent(false) });
document.addEventListener("webkitfullscreenchange",function(){ if(!isFull()&&ST.present) setPresent(false) });
$("rotNext").addEventListener("click",function(){ ST.rot++; renderRot(); if(!ST.rotPaused) startTimers() });
$("rotPrev").addEventListener("click",function(){ ST.rot--; renderRot(); if(!ST.rotPaused) startTimers() });
$("rotPause").addEventListener("click",function(){ ST.rotPaused=!ST.rotPaused;
  $("rotPause").textContent=ST.rotPaused?"Play":"Pause";
  if(ST.rotPaused){ stopTimers(); $("prog").classList.remove("run") } else { restartProg(); startTimers() } });
document.addEventListener("keydown",function(e){
  var typing = document.activeElement===$("q") || /^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement||{}).tagName||"");
  if(e.key==="/"&&!typing){ e.preventDefault(); $("q").focus(); return }
  if((e.key==="f"||e.key==="F")&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); toggleFull(); return }
  if(e.key==="Escape"){
    if(ST.present&&!isFull()){ setPresent(false); return }   // Esc already exits real fullscreen itself
    $("q").value=""; ST.round=null; ST.grade=null; onSearch(); $("q").blur();
  } });
(function(){ var v=getComputedStyle(document.documentElement).getPropertyValue("--sprite");
  var m=v.match(/url\(["']?([^"')]+)/); if(!m){ console.error("sprite var missing"); return }
  var im=new Image(); im.onload=function(){ console.log("sprite ok "+im.naturalWidth+"x"+im.naturalHeight) };
  im.onerror=function(){ console.error("sprite FAILED to decode") }; im.src=m[1]; })();
var _cr=document.querySelector(".brand img.crest");
if(_cr){ var rep=function(){ console.log(_cr.naturalWidth?("crest ok "+_cr.naturalWidth+"x"+_cr.naturalHeight):"crest FAILED to decode") };
  if(_cr.complete) rep(); else { _cr.addEventListener("load",rep); _cr.addEventListener("error",function(){console.error("crest FAILED to decode")}) } }
console.log("TAS Sport Centre ready:",M.length,"fixtures (incl",D.B.length,"byes),",
  M.filter(function(m){return m.played}).length,"results,",D.L.length,"ladders,",D.C.length,"competitions; latest",LAST,"round",LASTROUND);
}
})();
</script>
