name: Refresh TAS data

on:
  schedule:
    # Hourly, at 17 minutes past, to stay off the busy top of the hour.
    # Times are UTC. Brisbane is UTC+10, so Saturday morning sport lands
    # roughly 21:00 Friday to 02:00 Saturday UTC.
    - cron: "17 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - "config.json"       # re-fetch straight away when the term changes
      - "scripts/fetch-tas.mjs"

# Lets the job commit data.json back to the repository
permissions:
  contents: write

concurrency:
  group: refresh-tas
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch fixtures and ladders
        run: node scripts/fetch-tas.mjs

      - name: Commit data.json if it changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No change in the data, nothing to commit."
            exit 0
          fi
          git config user.name  "taipans-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh TAS data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
